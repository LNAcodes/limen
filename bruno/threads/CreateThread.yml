info:
  name: CreateThread
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/threads"
  body:
    type: json
    data: |-
      {
        "title": "Cooperation between schools and youth welfare offices",
        "content": "Which formats work well for regular exchange between school social work and the youth welfare office?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
